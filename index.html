<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>ONC SPS — Shepherd Report</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Outfit:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --navy: #0f2044;
      --blue: #1a3a6b;
      --accent: #2e80e8;
      --gold: #f0a500;
      --green: #22c55e;
      --red: #ef4444;
      --light: #f0f5ff;
      --white: #ffffff;
      --gray: #64748b;
      --border: #dce7f7;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: linear-gradient(160deg, #0f2044 0%, #1a3a6b 50%, #0f2044 100%);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 20px 16px 40px;
    }

    .app {
      width: 100%;
      max-width: 480px;
    }

    /* HEADER */
    .header {
      text-align: center;
      padding: 28px 0 24px;
      animation: fadeDown 0.6s ease;
    }

    .logo-ring {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), #f5c842);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
      box-shadow: 0 8px 24px rgba(240, 165, 0, 0.35);
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 22px;
      color: var(--navy);
      letter-spacing: -0.5px;
    }

    .header h1 {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 22px;
      color: var(--white);
      letter-spacing: 0.5px;
    }

    .header p {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 4px;
    }

    /* CARD */
    .card {
      background: var(--white);
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: fadeUp 0.6s ease 0.1s both;
    }

    .card-title {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 17px;
      color: var(--navy);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
      display: inline-block;
    }

    /* STEP INDICATOR */
    .steps {
      display: flex;
      gap: 6px;
      margin-bottom: 24px;
    }

    .step-dot {
      flex: 1;
      height: 4px;
      border-radius: 4px;
      background: var(--border);
      transition: background 0.3s;
    }

    .step-dot.active {
      background: var(--accent);
    }

    .step-dot.done {
      background: var(--green);
    }

    /* FORM SECTIONS */
    .section {
      display: none;
    }

    .section.active {
      display: block;
      animation: fadeUp 0.35s ease;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--gray);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
    }

    .field select,
    .field textarea,
    .field input {
      width: 100%;
      padding: 13px 16px;
      border: 2px solid var(--border);
      border-radius: 12px;
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      color: var(--navy);
      background: var(--light);
      appearance: none;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .field select:focus,
    .field textarea:focus,
    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(46, 128, 232, 0.12);
      background: white;
    }

    .select-wrap {
      position: relative;
    }

    .select-wrap::after {
      content: '▾';
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--accent);
      pointer-events: none;
      font-size: 16px;
    }

    /* YES/NO BUTTONS */
    .yn-group {
      display: flex;
      gap: 10px;
    }

    .yn-btn {
      flex: 1;
      padding: 14px;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: var(--light);
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 15px;
      color: var(--gray);
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .yn-btn.yes.selected {
      background: #dcfce7;
      border-color: var(--green);
      color: #15803d;
    }

    .yn-btn.no.selected {
      background: #fee2e2;
      border-color: var(--red);
      color: #b91c1c;
    }

    .yn-btn:not(.selected):hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* CONTACT TYPE */
    .type-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .type-btn {
      flex: 1;
      min-width: 80px;
      padding: 12px 8px;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: var(--light);
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      font-size: 13px;
      color: var(--gray);
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .type-btn .icon {
      font-size: 20px;
      display: block;
      margin-bottom: 4px;
    }

    .type-btn.selected {
      background: #eff6ff;
      border-color: var(--accent);
      color: var(--accent);
    }

    /* NAVIGATION BUTTONS */
    .nav-btns {
      display: flex;
      gap: 10px;
      margin-top: 24px;
    }

    .btn-back {
      padding: 14px 20px;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: transparent;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 15px;
      color: var(--gray);
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-back:hover {
      border-color: var(--navy);
      color: var(--navy);
    }

    .btn-next {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), #1a5fc4);
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 15px;
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(46, 128, 232, 0.35);
      transition: all 0.2s;
    }

    .btn-next:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(46, 128, 232, 0.45);
    }

    .btn-next:active {
      transform: translateY(0);
    }

    .btn-next:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-submit {
      flex: 1;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--green), #16a34a);
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 16px;
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(34, 197, 94, 0.35);
      transition: all 0.2s;
    }

    .btn-submit:hover {
      transform: translateY(-1px);
    }

    /* REVIEW SECTION */
    .review-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .review-item:last-child {
      border-bottom: none;
    }

    .review-label {
      font-size: 13px;
      color: var(--gray);
    }

    .review-value {
      font-weight: 700;
      font-size: 14px;
      color: var(--navy);
      text-align: right;
      max-width: 60%;
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }

    .badge.yes {
      background: #dcfce7;
      color: #15803d;
    }

    .badge.no {
      background: #fee2e2;
      color: #b91c1c;
    }

    /* SUCCESS SCREEN */
    .success-screen {
      text-align: center;
      padding: 20px 0;
      animation: bounceIn 0.5s ease;
    }

    .success-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--green), #16a34a);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 36px;
      box-shadow: 0 8px 24px rgba(34, 197, 94, 0.35);
    }

    .success-screen h2 {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 22px;
      color: var(--navy);
      margin-bottom: 8px;
    }

    .success-screen p {
      color: var(--gray);
      font-size: 14px;
      line-height: 1.6;
    }

    .btn-new {
      margin-top: 24px;
      width: 100%;
      padding: 14px;
      border: 2px solid var(--accent);
      border-radius: 12px;
      background: transparent;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 15px;
      color: var(--accent);
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-new:hover {
      background: var(--accent);
      color: white;
    }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--navy);
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease;
      z-index: 999;
      white-space: nowrap;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    /* ANIMATIONS */
    @keyframes fadeDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes bounceIn {
      0% {
        transform: scale(0.8);
        opacity: 0;
      }

      60% {
        transform: scale(1.05);
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* FOOTER */
    .footer {
      text-align: center;
      margin-top: 20px;
      color: rgba(255, 255, 255, 0.35);
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="header">
      <div class="logo-ring">ONC</div>
      <h1>SPS Follow-Up Report</h1>
      <p>Overcomers Nation Church</p>
    </div>
    <div class="card" id="mainCard">
      <div class="steps">
        <div class="step-dot active" id="dot1"></div>
        <div class="step-dot" id="dot2"></div>
        <div class="step-dot" id="dot3"></div>
        <div class="step-dot" id="dot4"></div>
      </div>

      <!-- SEC 1: WHO ARE YOU -->
      <div class="section active" id="sec1">
        <div class="card-title"><span class="dot"></span>Who are you?</div>
        <div class="field">
          <label>Select Your Name</label>
          <div class="select-wrap">
            <select id="shepherdSelect"><option value="">— Choose your name —</option></select>
          </div>
        </div>
        <div class="field">
          <label>Session Info</label>
          <div id="sessionInfo" style="display:none;background:#f0f5ff;border-radius:12px;padding:14px 16px;font-size:14px;color:#0f2044;border:2px solid #dce7f7;line-height:2.2;">
            <div>📅 <strong id="dispDate"></strong></div>
            <div>📆 <strong id="dispDay"></strong></div>
            <div>🕐 <strong id="dispTime"></strong></div>
            <div>⏱ Duration: <strong>10 minutes</strong></div>
          </div>
          <div id="sessionPlaceholder" style="color:#64748b;font-size:13px;padding:10px 0;">Select your name to see session details</div>
        </div>
        <div class="nav-btns">
          <button class="btn-next" onclick="goNext(1)">Next →</button>
        </div>
      </div>

      <!-- SEC 2: ATTENDANCE -->
      <div class="section" id="sec2">
        <div class="card-title"><span class="dot"></span>Who Attended?</div>
        <div id="attendanceCount" style="font-size:13px;color:#2e80e8;font-weight:700;margin-bottom:14px;"></div>
        <div id="memberCards" style="display:flex;flex-direction:column;gap:10px;"></div>
        <div class="nav-btns">
          <button class="btn-back" onclick="goBack(2)">← Back</button>
          <button class="btn-next" onclick="goNext(2)">Next →</button>
        </div>
      </div>

      <!-- SEC 3: SESSION DETAILS -->
      <div class="section" id="sec3">
        <div class="card-title"><span class="dot"></span>Session Details</div>
        <div class="field">
          <label>Bible Study Topic</label>
          <div id="topicBox" style="background:#f0f5ff;border-radius:12px;padding:14px 16px;border:2px solid #dce7f7;">
            <div id="topicText" style="font-size:14px;color:#64748b;">⏳ Loading topic...</div>
          </div>
          <div id="topicButtons" style="display:none;margin-top:10px;">
            <div style="font-size:12px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;">Was this topic covered?</div>
            <div class="yn-group">
              <button class="yn-btn yes" onclick="selectYN('topicCovered','yes',this)">✅ Yes</button>
              <button class="yn-btn no" onclick="selectYN('topicCovered','no',this)">❌ No</button>
            </div>
          </div>
        </div>
        <div class="field">
          <label>Prayer Done?</label>
          <div class="yn-group">
            <button class="yn-btn yes" onclick="selectYN('prayerDone','yes',this)">✅ Yes</button>
            <button class="yn-btn no" onclick="selectYN('prayerDone','no',this)">❌ No</button>
          </div>
        </div>
        <div class="field">
          <label>Member Concerns <span style="font-weight:400;color:#94a3b8">(optional — attended only)</span></label>
          <div id="concernFields" style="display:flex;flex-direction:column;gap:10px;"></div>
        </div>
        <div class="nav-btns">
          <button class="btn-back" onclick="goBack(3)">← Back</button>
          <button class="btn-next" onclick="goNext(3)">Next →</button>
        </div>
      </div>

      <!-- SEC 4: REVIEW -->
      <div class="section" id="sec4">
        <div class="card-title"><span class="dot"></span>Review &amp; Confirm</div>
        <div id="reviewContent"></div>
        <div class="nav-btns">
          <button class="btn-back" onclick="goBack(4)">← Back</button>
          <button class="btn-submit" onclick="submitReport()">✅ Confirm &amp; Submit</button>
        </div>
      </div>

      <!-- SUCCESS -->
      <div class="section" id="secSuccess">
        <div class="success-screen">
          <div class="success-icon">✅</div>
          <h2 id="successTitle">Report Submitted!</h2>
          <p id="successBody"></p>
          <button class="btn-new" onclick="resetForm()">+ Submit Another Report</button>
        </div>
      </div>
    </div>
    <div class="footer">ONC SPS System — Overcomers Nation Church</div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzl5Nd0kLD08Q7vowaTEHG2hjybQRlctfx97xOfB07N9e8VKUKXMQ-wCfFz5ztrmADF/exec';

    const shepherdData = {
      'Frank Armah': ['Amos Tornyi','Gideon Daunor Tawiah','Florence Ablordey','Janet Oye'],
      'Bright Mamene': ['Janelle Kekeli Dartey','Patricia Mensah','Hannah Akuffo France','Titus Quaye'],
      'Christiana Konzondong': ['Gyedu Samuel Amponsah','Getrude Abena Owusu Achiaa','Shirley Williams','Abigail Asantewaa-Boadu'],
      'Gloria Owusu Ansah': ['Samuel Torto','Emmanuel Kwaku Amon','Diana Ameyaw','Mrs. Petrina Gyan'],
      'Linda Neequaye': ['Isaac Yeboah','Melchizedek Ofori','Ruth Dadzie','Lawrence Gbeku'],
      'Abena Achia': ['Jedidiah Wiafe','Williams Asomaning Ameyaw','Pius Owusu Danquah','Promise Bamflo'],
      'Gloria Lartey': ['Agnes Amoako','Gerald Opoku','Maame Efua Owusu Boateng','Lewis Nana Kojo'],
      'Priscilla Sedi Anatsui': ['Selina Ofeibea','Isaac Oblitey','Princess Gyamfuaa','Danis Agbormava'],
      'Abigail Akakpo': ['Mary Seke','Lucy Yaa B Agyemang','Francis Kweku Opoku Ivan','Micheal Kwabena Agyapong'],
      'LP. Sophia Korkor': ['Kevin Nyarko','Dorcas Janssen','Abraham Can-Tamakloe','Veronica Bemponmaa Boateng'],
      'Wisdom Akakpo': ['Philip Boateng','Justina Tetteh','Anita Asamoah','Rebecca Quaye'],
      'Cyril Amevor': ['Bernice Can-Tamakloe','Julianna Owusu Ansah','Joseph Asmah','Deborah Quaye'],
      'Mr. Ebenezer Okronipa': ['Aaron Dela Mawuena','Stanley Boateng','Bernice Agyapong Quaye','Majeed Saleem'],
      'Solomon Aziakah': ['Abraham Delove','Sylvester Effah','Alberta Manu','Bernice Mensah'],
      'Deborah Otumfuor': ['Obed Adu-Mensah','David Kudadze','Dr. Derrick Korletey','Christiana Adjei'],
      'Christable Arhin': ['Laureta Cabu','Victoria Amuzu','George Sarfo Mensah','Mrs. Elizabeth Agbedo'],
      'Patience Addo': ['Peace Amoah','Grace Sakyibea','Sunday Amuzu','Ruth Otoo'],
      'Benjamin Armah Agyeman': ['Isabel Opoku','Joseph Atsu','Jeremiah Asante','Eugene Ampadu'],
      'Martha Asiamah': ['Samuel Boadu','Rosemary Obeng Appiah','Kingsley Kobina Aduful','Emmanuel Nii-Lantei'],
      'Shine Asinyo': ['Harriet Ampofo','Sharon Tricia Amanu','Loretta Owusu','Madam Paulina Mansa Atiase'],
      'Patience Mensah': ['Dr. Mrs Abena Efua Korletey','Sandra Boateng','Samuel Oteng','Bernice Agyapong Quaye'],
      'Ruth Yeboah': ['Bernice Can-Tamakloe','Princess Gyamfuaa','Isaac Oblitey','Rebecca Quaye']
    };

    let state = {
      shepherd:'', sessionDate:'', sessionDay:'', sessionTime:'',
      attendance:{}, topicCovered:'', bibleTopic:'', prayerDone:'', concerns:{}
    };
    let currentStep = 1;

    // Init shepherd dropdown
    const shepSel = document.getElementById('shepherdSelect');
    Object.keys(shepherdData).sort().forEach(s => {
      const o = document.createElement('option');
      o.value = s; o.textContent = s;
      shepSel.appendChild(o);
    });

    shepSel.addEventListener('change', function() {
      state.shepherd = this.value;
      if (!this.value) {
        document.getElementById('sessionInfo').style.display = 'none';
        document.getElementById('sessionPlaceholder').style.display = 'block';
        return;
      }
      const now = new Date();
      state.sessionDate = now.toLocaleDateString('en-GB');
      state.sessionDay  = now.toLocaleDateString('en-GB', {weekday:'long'});
      state.sessionTime = now.toLocaleTimeString('en-GB');
      document.getElementById('dispDate').textContent = state.sessionDate;
      document.getElementById('dispDay').textContent  = state.sessionDay;
      document.getElementById('dispTime').textContent = state.sessionTime;
      document.getElementById('sessionInfo').style.display = 'block';
      document.getElementById('sessionPlaceholder').style.display = 'none';
      state.attendance = {};
      (shepherdData[this.value] || []).forEach(m => state.attendance[m] = false);
    });

    function buildMemberCards() {
      const members = shepherdData[state.shepherd] || [];
      const container = document.getElementById('memberCards');
      container.innerHTML = '';
      members.forEach(m => {
        const present = state.attendance[m];
        const card = document.createElement('div');
        card.style.cssText = 'padding:14px 16px;border-radius:14px;border:2px solid ' +
          (present ? '#22c55e' : '#dce7f7') + ';background:' +
          (present ? '#dcfce7' : '#f0f5ff') +
          ';display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:all .2s;';
        card.innerHTML = '<span style="font-weight:700;color:#0f2044;font-size:15px;">' + m +
          '</span><span style="font-size:20px;">' + (present ? '✅' : '⭕') + '</span>';
        card.onclick = function() { state.attendance[m] = !state.attendance[m]; buildMemberCards(); };
        container.appendChild(card);
      });
      const count = Object.values(state.attendance).filter(Boolean).length;
      document.getElementById('attendanceCount').textContent = count + ' of ' + members.length + ' attended';
    }

    function buildConcernFields() {
      const attended = Object.entries(state.attendance).filter(function(e){return e[1];}).map(function(e){return e[0];});
      const cf = document.getElementById('concernFields');
      cf.innerHTML = '';
      if (!attended.length) {
        cf.innerHTML = '<p style="color:#64748b;font-size:13px;">No members marked as attended.</p>';
        return;
      }
      attended.forEach(function(m) {
        const wrap = document.createElement('div');
        const inputId = 'concern_' + m.replace(/[^a-zA-Z0-9]/g,'_');
        wrap.innerHTML = '<label style="display:block;font-size:12px;font-weight:600;color:#64748b;margin-bottom:6px;">' + m + '</label>' +
          '<input type="text" id="' + inputId + '" placeholder="Any concern or prayer request?" ' +
          'style="width:100%;padding:12px 14px;border:2px solid #dce7f7;border-radius:10px;font-family:Outfit,sans-serif;font-size:14px;color:#0f2044;background:#f0f5ff;outline:none;" ' +
          'value="' + (state.concerns[m]||'').replace(/"/g,'&quot;') + '">';
        wrap.querySelector('input').addEventListener('input', function() { state.concerns[m] = this.value; });
        cf.appendChild(wrap);
      });
    }

    function fetchTopic() {
      document.getElementById('topicText').textContent = '⏳ Loading topic...';
      document.getElementById('topicText').style.color = '#64748b';
      document.getElementById('topicButtons').style.display = 'none';
      var done = false;
      var s = document.createElement('script');
      window._topicCallback = function(data) {
        if (done) return; done = true;
        state.bibleTopic = (data && data.topic) ? data.topic : '';
        if (state.bibleTopic) {
          document.getElementById('topicText').innerHTML = '<strong>This week\'s topic:</strong> ' + state.bibleTopic;
          document.getElementById('topicText').style.color = '#0f2044';
          document.getElementById('topicButtons').style.display = 'block';
        } else {
          document.getElementById('topicText').textContent = 'No topic set this week.';
        }
        if (document.body.contains(s)) document.body.removeChild(s);
      };
      s.src = SCRIPT_URL + '?action=getTopic&callback=_topicCallback';
      s.onerror = function() { window._topicCallback({}); };
      document.body.appendChild(s);
      setTimeout(function() { window._topicCallback({}); }, 6000);
    }

    function selectYN(field, val, btn) {
      state[field] = val;
      btn.closest('.yn-group').querySelectorAll('.yn-btn').forEach(function(b){ b.classList.remove('selected'); });
      btn.classList.add('selected');
    }

    function buildReview() {
      var members = shepherdData[state.shepherd] || [];
      var present = members.filter(function(m){ return state.attendance[m]; });
      var absent  = members.filter(function(m){ return !state.attendance[m]; });
      var rate = members.length ? Math.round(present.length / members.length * 100) : 0;
      var html = '' +
        '<div class="review-item"><span class="review-label">Shepherd</span><span class="review-value">' + state.shepherd + '</span></div>' +
        '<div class="review-item"><span class="review-label">Date</span><span class="review-value">' + state.sessionDate + ' (' + state.sessionDay + ')</span></div>' +
        '<div class="review-item"><span class="review-label">Attendance</span><span class="review-value">' + present.length + '/' + members.length + ' — ' + rate + '%</span></div>' +
        '<div class="review-item"><span class="review-label">Present</span><span class="review-value" style="color:#15803d;">' + (present.join(', ')||'None') + '</span></div>' +
        '<div class="review-item"><span class="review-label">Absent</span><span class="review-value" style="color:#b91c1c;">' + (absent.join(', ')||'None') + '</span></div>' +
        '<div class="review-item"><span class="review-label">Bible Topic</span><span class="review-value">' + (state.bibleTopic||'None') + '</span></div>' +
        '<div class="review-item"><span class="review-label">Topic Covered</span><span class="review-value"><span class="badge ' + (state.topicCovered||'no') + '">' + (state.topicCovered||'N/A').toUpperCase() + '</span></span></div>' +
        '<div class="review-item"><span class="review-label">Prayer Done</span><span class="review-value"><span class="badge ' + (state.prayerDone||'no') + '">' + (state.prayerDone||'N/A').toUpperCase() + '</span></span></div>';
      present.forEach(function(m) {
        if (state.concerns[m]) {
          html += '<div class="review-item"><span class="review-label">' + m + '</span><span class="review-value" style="font-size:13px;">' + state.concerns[m] + '</span></div>';
        }
      });
      document.getElementById('reviewContent').innerHTML = html;
    }

    function goNext(step) {
      if (step === 1) {
        if (!state.shepherd) { showToast('Please select your name'); return; }
        buildMemberCards();
      }
      if (step === 2) {
        buildConcernFields();
        fetchTopic();
      }
      if (step === 3) {
        if (!state.prayerDone) { showToast('Please answer the prayer question'); return; }
        buildReview();
      }
      document.getElementById('sec' + step).classList.remove('active');
      currentStep = step + 1;
      document.getElementById('sec' + currentStep).classList.add('active');
      updateDots();
    }

    function goBack(step) {
      document.getElementById('sec' + step).classList.remove('active');
      currentStep = step - 1;
      document.getElementById('sec' + currentStep).classList.add('active');
      updateDots();
    }

    function updateDots() {
      for (var i = 1; i <= 4; i++) {
        var d = document.getElementById('dot' + i);
        d.className = 'step-dot';
        if (i < currentStep) d.classList.add('done');
        else if (i === currentStep) d.classList.add('active');
      }
    }

    async function submitReport() {
      var btn = document.querySelector('.btn-submit');
      btn.textContent = 'Submitting...'; btn.disabled = true;
      var members = shepherdData[state.shepherd] || [];
      var present = members.filter(function(m){ return state.attendance[m]; });
      var absent  = members.filter(function(m){ return !state.attendance[m]; });
      var payload = {
        action: 'submitReport',
        shepherd: state.shepherd,
        sessionDate: state.sessionDate,
        sessionDay: state.sessionDay,
        sessionTime: state.sessionTime,
        membersPresent: present,
        membersAbsent: absent,
        totalMembers: members.length,
        bibleTopic: state.bibleTopic,
        topicCovered: state.topicCovered,
        prayerDone: state.prayerDone,
        concerns: state.concerns,
        notes: ''
      };
      try {
        await fetch(SCRIPT_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
      } catch(e) {}
      var rate = members.length ? Math.round(present.length / members.length * 100) : 0;
      document.getElementById('successTitle').textContent = 'Report Submitted! Thank you ' + state.shepherd.split(' ')[0] + '!';
      document.getElementById('successBody').innerHTML = '📅 ' + state.sessionDate + '<br>👥 ' + present.length + ' of ' + members.length + ' members reported<br>📊 Attendance rate: ' + rate + '%';
      document.getElementById('sec4').classList.remove('active');
      document.getElementById('secSuccess').classList.add('active');
      document.querySelector('.steps').style.display = 'none';
      btn.disabled = false;
    }

    function resetForm() {
      state = { shepherd:'', sessionDate:'', sessionDay:'', sessionTime:'', attendance:{}, topicCovered:'', bibleTopic:'', prayerDone:'', concerns:{} };
      currentStep = 1;
      document.querySelectorAll('.section').forEach(function(s){ s.classList.remove('active'); });
      document.getElementById('sec1').classList.add('active');
      document.querySelector('.steps').style.display = 'flex';
      document.getElementById('shepherdSelect').value = '';
      document.getElementById('sessionInfo').style.display = 'none';
      document.getElementById('sessionPlaceholder').style.display = 'block';
      document.querySelectorAll('.yn-btn').forEach(function(b){ b.classList.remove('selected'); });
      updateDots();
    }

    function showToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(function(){ t.classList.remove('show'); }, 2500);
    }
  </script>
</body>
</html>
