<style>
        body {
            font-family: 'Work Sans', sans-serif;
        }
        h1, h2, .font-h1, .font-h2 {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
    
    @keyframes fall {
        0% {
            transform: translate3d(0, 0, 0) rotate(0deg);
            opacity: 1;
        }
        100% {
            transform: translate3d(var(--tx), var(--ty), 0) rotate(var(--rot));
            opacity: 0;
        }
    }
    .confetti {
        position: absolute;
        width: 10px;
        height: 10px;
        top: 50%;
        left: 50%;
        pointer-events: none;
        animation: fall cubic-bezier(.37,0,.63,1) forwards;
        z-index: 0;
    }
    @media (prefers-reduced-motion) {
        .confetti {
            animation: none;
            display: none;
        }
    }
  </style>
</head>
<body class="bg-surface-bright min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<div class="absolute inset-0 pointer-events-none w-full h-full z-0 overflow-hidden" id="confetti-container"></div>
<main class="relative z-10 flex flex-col items-center justify-center max-w-lg mx-auto p-margin text-center gap-lg">
<div class="w-32 h-32 rounded-full bg-tertiary-fixed-dim flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-on-tertiary-container" style="font-size: 64px; font-variation-settings: 'FILL' 1;">
                check
            </span>
</div>
<div class="flex flex-col gap-sm max-w-sm">
<h1 class="font-h1 text-h1 text-on-surface">Report Submitted! ✅</h1>
<p class="font-body text-body text-on-surface-variant">Thank you for staying faithful to your calling.</p>
</div>
<div class="flex flex-col sm:flex-row gap-md w-full sm:w-auto mt-sm">
<button class="flex items-center justify-center gap-base px-md py-sm rounded-lg bg-tertiary-fixed-dim text-on-tertiary-container font-label text-label hover:opacity-90 transition-opacity w-full sm:w-auto">
<span class="material-symbols-outlined text-body font-body" style="font-size: 18px;">add</span>
                Submit Another Report
            </button>
<button class="flex items-center justify-center gap-base px-md py-sm rounded-lg bg-primary-container text-on-primary font-label text-label hover:bg-secondary-container hover:text-on-secondary-container transition-colors shadow-sm w-full sm:w-auto">
<span class="material-symbols-outlined text-body font-body" style="font-size: 18px;">home</span>
                Return to Home
            </button>
</div>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (prefersReducedMotion) return;

            const container = document.getElementById('confetti-container');
            const colors = ['#1B5E20', '#D4A574', '#B4D84A'];
            const particleCount = 100;

            for (let i = 0; i < particleCount; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                
                // Random properties
                const color = colors[Math.floor(Math.random() * colors.length)];
                const duration = Math.random() * 2 + 2; // 2s to 4s
                
                // Random burst trajectory
                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * 300 + 100;
                
                // Calculate end positions based on burst
                const tx = Math.cos(angle) * velocity + (Math.random() * 200 - 100);
                const ty = Math.sin(angle) * velocity + (Math.random() * 200 + 300); // Fall downwards
                const rot = Math.random() * 720 - 360; // Random rotation

                // Shape
                const isCircle = Math.random() > 0.5;
                if (isCircle) {
                    confetti.style.borderRadius = '50%';
                }
                
                // Apply styles
                confetti.style.backgroundColor = color;
                confetti.style.setProperty('--tx', `${tx}px`);
                confetti.style.setProperty('--ty', `${ty}px`);
                confetti.style.setProperty('--rot', `${rot}deg`);
                confetti.style.animationDuration = `${duration}s`;
                
                // Small random delay for staggered effect
                confetti.style.animationDelay = `${Math.random() * 0.2}s`;

                container.appendChild(confetti);
            }
            
            // Clean up elements after animation finishes
            setTimeout(() => {
                container.innerHTML = '';
            }, 5000);
        });
    </script>
</body></html>
