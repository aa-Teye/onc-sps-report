<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Generations Chapel - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&amp;family=Work+Sans:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed-dim": "#91d78a",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-container": "#79542a",
                        "primary": "#00450d",
                        "error": "#ba1a1a",
                        "surface-container": "#edeeef",
                        "secondary-fixed-dim": "#efbd8a",
                        "secondary-fixed": "#ffdcbc",
                        "surface-bright": "#f8f9fa",
                        "primary-fixed": "#acf4a4",
                        "on-primary": "#ffffff",
                        "tertiary-fixed": "#cbf160",
                        "primary-container": "#1b5e20",
                        "on-tertiary-fixed-variant": "#3b4d00",
                        "tertiary-container": "#455900",
                        "tertiary": "#314000",
                        "surface-container-highest": "#e1e3e4",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed-variant": "#614018",
                        "on-error-container": "#93000a",
                        "tertiary-fixed-dim": "#b0d446",
                        "on-primary-container": "#90d689",
                        "surface-variant": "#e1e3e4",
                        "inverse-primary": "#91d78a",
                        "on-secondary": "#ffffff",
                        "on-surface-variant": "#41493e",
                        "outline": "#717a6d",
                        "on-primary-fixed-variant": "#0c5216",
                        "on-error": "#ffffff",
                        "on-surface": "#191c1d",
                        "background": "#f8f9fa",
                        "on-primary-fixed": "#002203",
                        "inverse-surface": "#2e3132",
                        "secondary-container": "#fecb97",
                        "surface-tint": "#2a6b2c",
                        "on-tertiary-fixed": "#161f00",
                        "secondary": "#7c572d",
                        "on-tertiary": "#ffffff",
                        "outline-variant": "#c0c9bb",
                        "surface-dim": "#d9dadb",
                        "surface": "#f8f9fa",
                        "inverse-on-surface": "#f0f1f2",
                        "surface-container-low": "#f3f4f5",
                        "on-background": "#191c1d",
                        "surface-container-high": "#e7e8e9",
                        "on-tertiary-container": "#afd345",
                        "on-secondary-fixed": "#2c1700"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "24px",
                        "lg": "48px",
                        "base": "8px",
                        "margin": "16px",
                        "xl": "80px",
                        "sm": "12px",
                        "xs": "4px",
                        "gutter": "24px"
                    },
                    "fontFamily": {
                        "h1": ["Plus Jakarta Sans", "sans-serif"],
                        "h2": ["Plus Jakarta Sans", "sans-serif"],
                        "label": ["Work Sans", "sans-serif"],
                        "small": ["Work Sans", "sans-serif"],
                        "body": ["Work Sans", "sans-serif"]
                    },
                    "fontSize": {
                        "h1": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "h2": ["23px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "label": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "small": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #F8F9FA;
        }
        .login-card-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body text-on-surface bg-background min-h-screen flex items-center justify-center p-margin md:p-md">
<main class="w-full max-w-[480px]">
<!-- Header Section -->
<header class="mb-lg text-center relative">
<button aria-label="Go back" class="absolute left-0 top-0 p-sm text-primary hover:bg-surface-container-highest rounded-full transition-colors">
<span class="material-symbols-outlined" style="font-size: 24px;">arrow_back</span>
</button>
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-surface-container-lowest border border-outline-variant mb-md login-card-shadow">
<span class="material-symbols-outlined text-primary-container" style="font-size: 32px; font-variation-settings: 'FILL' 1;">church</span>
</div>
<h1 class="font-h1 text-h1 text-primary mb-base">Welcome Back</h1>
<p class="font-body text-body text-on-surface-variant">Select your name and enter PIN</p>
</header>
<!-- Error Banner (Hidden by default, shown for demonstration) -->
<div class="hidden bg-error-container text-on-error-container p-sm rounded-lg border border-error/20 mb-md flex items-center gap-sm" id="error-banner" role="alert">
<span class="material-symbols-outlined text-error">error</span>
<span class="font-small text-small font-medium">Invalid PIN. Please try again.</span>
</div>
<!-- Login Form -->
<form class="bg-surface-container-lowest p-md md:p-lg rounded-xl border border-outline-variant login-card-shadow" onsubmit="event.preventDefault(); document.getElementById('error-banner').classList.remove('hidden');">
<!-- Name Dropdown -->
<div class="mb-md">
<label class="block font-label text-label text-on-surface-variant mb-base" for="user-name">Select Your Name*</label>
<div class="relative">
<select class="appearance-none w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-body text-body rounded-lg py-sm pl-sm pr-lg focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all" id="user-name" name="user-name" required="">
<option disabled="" selected="" value="">Choose your profile...</option>
<option value="john-doe">John Doe</option>
<option value="mary-smith">Mary Smith</option>
<option value="sam-johnson">Sam Johnson</option>
<option value="amos-mensah">Amos Mensah</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-sm text-on-surface-variant">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<!-- PIN Input -->
<div class="mb-lg">
<label class="block font-label text-label text-on-surface-variant mb-base" for="pin-input">Enter 4-Digit PIN*</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-body text-body rounded-lg p-sm focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all text-center tracking-widest text-2xl" id="pin-input" inputmode="numeric" maxlength="4" name="pin-input" pattern="[0-9]{4}" placeholder="••••" required="" type="password"/>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-on-primary font-body text-body font-semibold rounded-lg py-sm px-md hover:bg-secondary transition-colors duration-200 flex justify-center items-center gap-base shadow-sm" type="submit">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">lock_open</span>
                Verify &amp; Enter Portal
            </button>
</form>
<!-- Footer Links -->
<div class="mt-md flex justify-between items-center px-sm">
<a class="font-small text-small text-primary-container hover:text-secondary hover:underline transition-all" href="#">Forgot PIN?</a>
<a class="font-small text-small text-primary-container hover:text-secondary hover:underline transition-all flex items-center gap-xs" href="#">
<span class="material-symbols-outlined" style="font-size: 16px;">forum</span>
                WhatsApp Support
            </a>
</div>
</main>
<script>
        // Simple interaction for error state demo
        document.getElementById('pin-input').addEventListener('input', function() {
            document.getElementById('error-banner').classList.add('hidden');
        });
    </script>
</body></html>
