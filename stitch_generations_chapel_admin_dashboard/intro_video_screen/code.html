<!-- SVG Ring -->

</svg>
<!-- Skip Button inside ring -->

</button>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const DURATION = 120; // seconds for demo
            let timeLeft = DURATION;
            const circle = document.getElementById('progress-circle');
            const radius = circle.r.baseVal.value;
            const circumference = radius * 2 * Math.PI;
            
            circle.style.strokeDasharray = `${circumference} ${circumference}`;
            circle.style.strokeDashoffset = 0;
            
            const timerText = document.getElementById('timer-text');
            const skipBtn1 = document.getElementById('skip-btn-1');
            const skipBtn2 = document.getElementById('skip-btn-2');
            const skipGroup1 = document.getElementById('skip-group-1');
            
            const video1 = document.getElementById('video-1');
            const video2 = document.getElementById('video-2');
            
            // Allow skip immediately for demo purposes, but visual shows countdown
            // In reality, this might be disabled until a certain time
            
            function setProgress(percent) {
                const offset = circumference - percent / 100 * circumference;
                circle.style.strokeDashoffset = offset;
            }
            
            const interval = setInterval(() => {
                timeLeft--;
                timerText.textContent = `${timeLeft}s`;
                
                const percent = (timeLeft / DURATION) * 100;
                setProgress(percent);
                
                if (timeLeft <= 0) {
                    clearInterval(interval);
                    advanceToVideo2();
                }
            }, 1000); // Set to 100 for faster demo, normally 1000
            
            function advanceToVideo2() {
                clearInterval(interval);
                
                // Hide Video 1
                video1.classList.remove('scale-100', 'opacity-100');
                video1.classList.add('scale-95', 'opacity-0', 'pointer-events-none');
                
                // Show Video 2
                setTimeout(() => {
                    video2.classList.remove('scale-95', 'opacity-0', 'pointer-events-none');
                    video2.classList.add('scale-100', 'opacity-100');
                    
                    // Switch Controls
                    skipGroup1.classList.add('hidden');
                    skipBtn2.classList.remove('hidden');
                    
                    // Auto redirect after video 2 simulated time
                    setTimeout(redirectToDashboard, 5000); 
                }, 500);
            }
            
            function redirectToDashboard() {
                // Fade out everything
                document.body.classList.add('opacity-0');
                setTimeout(() => {
                    console.log('Redirecting to dashboard/role selection...');
                    // window.location.href = '/dashboard';
                }, 500);
            }
            
            skipBtn1.addEventListener('click', advanceToVideo2);
            skipBtn2.addEventListener('click', redirectToDashboard);
        });
    </script>
