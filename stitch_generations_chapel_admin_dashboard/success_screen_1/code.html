<button class="flex items-center justify-center gap-base px-md py-sm rounded-lg bg-primary-container text-on-primary font-label text-label hover:bg-secondary-container hover:text-on-secondary-container transition-colors shadow-sm w-full sm:w-auto">

</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            let particles = [];
            
            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            const colors = ['#b0d446', '#1b5e20', '#d4a574', '#91d78a', '#ffffff'];

            function createParticles() {
                for (let i = 0; i < 150; i++) {
                    particles.push({
                        x: canvas.width / 2,
                        y: canvas.height / 2 + 50,
                        r: Math.random() * 6 + 4,
                        dx: Math.random() * 20 - 10,
                        dy: Math.random() * -20 - 5,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        tilt: Math.floor(Math.random() * 10) - 10,
                        tiltAngleIncrement: (Math.random() * 0.07) + 0.05,
                        tiltAngle: 0
                    });
                }
            }

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let active = false;

                particles.forEach((p, index) => {
                    p.tiltAngle += p.tiltAngleIncrement;
                    p.y += (Math.cos(p.tiltAngle) + 1 + p.r / 2) / 2;
                    p.x += Math.sin(p.tiltAngle) * 2;
                    p.dy += 0.2; 
                    p.x += p.dx;
                    p.y += p.dy;

                    if (p.y <= canvas.height) {
                        active = true;
                    }

                    ctx.beginPath();
                    ctx.lineWidth = p.r;
                    ctx.strokeStyle = p.color;
                    ctx.moveTo(p.x + p.tilt + p.r, p.y);
                    ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
                    ctx.stroke();
                });

                if (active) {
                    requestAnimationFrame(draw);
                }
            }

            createParticles();
            draw();
        });
    </script>
